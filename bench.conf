# ===== llama-split-bench configuration =====
# Edit this file, or better: put machine-specific overrides in bench.local.conf
# (sourced after this one, git-ignored). Nothing else needs adjusting.

# --- binary / model ---
BIN=${BIN:-llama-server}              # llama.cpp server binary (PATH name or absolute path)
MODEL=${MODEL:-}                      # REQUIRED: path to the .gguf model to benchmark
MMPROJ=${MMPROJ:-}                    # optional multimodal projector (.gguf); empty = text only

# --- endpoint ---
HOST=${HOST:-127.0.0.1}               # server bind address (health checks always use 127.0.0.1)
PORT=${PORT:-18081}

# --- workload ---
CTX=${CTX:-262144}                    # target context size: server -c, ladder runs up to it
STAGES=${STAGES:-0,32000,64000,128000,196000,258000}   # ladder targets (tokens)
N_PREDICT=${N_PREDICT:-1000}          # decode tokens generated per ladder stage
PP0_SIZES=${PP0_SIZES:-512,2048,8192} # fresh-prompt sizes for the depth-0 prefill point
REAL_MODE=${REAL_MODE:-auto}          # mode that runs the real-prompt correction (auto = tensor, else first)
BASELINE=${BASELINE:-single}          # mode name used as the single-GPU baseline (figure panel 4)
RATIO_INIT=${RATIO_INIT:-4.3}         # initial chars-per-token guess for filler sizing (tokenizer dependent)

# --- GPUs ---
# DEVICES: llama.cpp device list used by the multi-GPU modes (see ./list-devices.sh)
DEVICES=${DEVICES:-CUDA0,CUDA1}
# SINGLE_DEV: device used by the "single" baseline mode (auto = first entry of DEVICES)
SINGLE_DEV=${SINGLE_DEV:-auto}

# MODES: name|device|split (split empty = binary default).
# Auto-built by run-bench.sh as: layer/tensor on all DEVICES + single on SINGLE_DEV.
# Define MODES here (or in bench.local.conf) only for a custom set; note that --devices on the
# command line always rebuilds the standard three (overriding a MODES defined in this file).
#   MODES=( "layer|CUDA0,CUDA1|layer" "tensor|CUDA0,CUDA1|tensor" "single|CUDA1|" "t2|CUDA0,CUDA2,CUDA3|tensor" )

# --- server arguments ---
NGL=${NGL:-all}                       # -ngl
THREADS=${THREADS:-8}                 # -t
FA=${FA:-on}                          # -fa value (flash attention; tensor split requires it)
JINJA=${JINJA:-1}                     # 1 = pass --jinja, 0 = omit
KV_K=${KV_K:-q8_0}                    # --cache-type-k (empty = build default)
KV_V=${KV_V:-q8_0}                    # --cache-type-v (empty = build default)
SPEC_ARGS=${SPEC_ARGS:---spec-type draft-mtp --spec-draft-n-max 2}   # "" disables speculative decoding
SPEC_DEVICE=${SPEC_DEVICE:-auto}      # device for the draft/MTP head (auto = the mode's devices)
LOAD_MODE=${LOAD_MODE:-}              # e.g. "mlock" to pin the model in RAM (needs enough RAM)
CACHE_ARGS=${CACHE_ARGS:---cache-ram 8192 --cache-idle-slots --cache-reuse 256}
EXTRA_ARGS=${EXTRA_ARGS:-}            # extra llama-server args appended verbatim

# --- plotting ---
VENV_PY=${VENV_PY:-$HOME/.venvs/bench-plot/bin/python}   # python with matplotlib
MACHINE=${MACHINE:-auto}              # label in the figure title (auto = hostname + GPUs)

# --- hardware sampler (optional fan logging) ---
FAN_HWMON=${FAN_HWMON:-auto}          # auto = first nct6* hwmon, "none" disables, or a path
FAN_CHANNELS=${FAN_CHANNELS:-1}       # hwmon pwm channels, e.g. "1" or "4,5"
